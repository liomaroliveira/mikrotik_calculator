<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador MikroTik v3.3 - Queues & FastTrack Fix</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --card-bg: #2b2b3b;
            --input-bg: #181825;
            --text: #cdd6f4;
            --accent: #89b4fa;
            --danger: #f38ba8;
            --warning: #fab387;
            --success: #a6e3a1;
            --border: #45475a;
        }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-layout { display: flex; gap: 20px; width: 100%; max-width: 1200px; flex-wrap: wrap; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); flex: 1; min-width: 320px; display: flex; flex-direction: column; }
        
        h2, h3 { color: var(--accent); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9em; color: #a6adc8; }
        .sub-label { font-size: 0.8em; color: #7f849c; margin-top: 2px; }
        
        select, input { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid var(--border); color: white; border-radius: 4px; margin-top: 5px; box-sizing: border-box; }
        
        .checkbox-wrapper { display: flex; align-items: center; margin-top: 15px; background: var(--input-bg); padding: 10px; border-radius: 4px; border: 1px solid var(--border); }
        .checkbox-wrapper input { width: auto; margin-right: 10px; margin-top: 0; }
        .checkbox-wrapper label { margin-top: 0; cursor: pointer; }

        .hidden { display: none; }
        
        .meter-box { margin-top: 15px; background: var(--input-bg); padding: 10px; border-radius: 6px; }
        .meter-label { display: flex; justify-content: space-between; font-size: 0.8em; margin-bottom: 5px; }
        .track { background: #313244; height: 8px; border-radius: 4px; overflow: hidden; }
        .fill { height: 100%; width: 0%; transition: width 0.5s ease, background 0.5s; }
        .low { background: var(--success); } .med { background: var(--warning); } .high { background: var(--danger); }

        .specs-display { font-size: 0.85em; color: #9399b2; margin-top: 5px; background: #11111b; padding: 10px; border-radius: 4px; border-left: 3px solid var(--accent); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #1e1e2e; }
        .btn-secondary { background: #45475a; color: white; }
        .btn-success { background: var(--success); color: #1e1e2e; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        textarea { width: 100%; height: 400px; background: #11111b; color: #a6e3a1; border: 1px solid var(--border); font-family: 'Courier New', monospace; font-size: 13px; padding: 15px; resize: vertical; box-sizing: border-box; margin-top: 10px; border-radius: 6px; }
        
        #realTrafficDisplay { font-size: 0.8em; color: var(--warning); margin-top: 5px; text-align: right; }
        #verdict { margin-top: 20px; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="card">
        <h2>1. Hardware e Cenário</h2>
        
        <label>Modelo MikroTik:</label>
        <select id="model" onchange="calculate()">
            <option value="rb941">RB941-2nD (hAP lite)</option>
            <option value="rb750r2">RB750r2 (hEX lite)</option>
            <option value="rb750gr3" selected>RB750Gr3 (hEX)</option>
            <option value="rb760igs">RB760iGS (hEX S)</option>
            <option value="rb2011">RB2011UiAS</option>
            <option value="rb3011">RB3011UiAS-RM</option>
            <option value="rb4011">RB4011iGS+RM</option>
            <option value="ccr1009">CCR1009-7G-1C-1S+</option>
            <option value="ccr1036">CCR1036-8G-2S+</option>
        </select>
        <div id="specs-div" class="specs-display">...</div>

        <label>Cenário de Uso:</label>
        <select id="scenario" onchange="toggleFields(); calculate();">
            <option value="hotspot">Hotspot (WiFeed / Captive Portal)</option>
            <option value="corporativo">Corporativo (DHCP + Firewall)</option>
            <option value="pppoe_server">Concentrador PPPoE</option>
        </select>

        <label>Parâmetros de Carga:</label>
        <div style="display:flex; gap:10px;">
            <div style="flex:1">
                <span class="sub-label">Usuários Ativos</span>
                <input type="number" id="users" value="25" min="1" oninput="calculate()">
            </div>
            <div style="flex:1">
                <span class="sub-label">Link Total (Mbps)</span>
                <input type="number" id="bandwidth" value="1000" min="1" oninput="calculate()">
            </div>
        </div>
        
        <div id="userSpeedContainer">
            <label>Plano por Usuário (Controle de Banda):</label>
            <div style="display:flex; gap:10px;">
                <div style="flex:1">
                    <span class="sub-label">Download (Mbps)</span>
                    <input type="number" id="userDl" value="10" min="1" oninput="calculate()">
                </div>
                <div style="flex:1">
                    <span class="sub-label">Upload (Mbps)</span>
                    <input type="number" id="userUl" value="5" min="1" oninput="calculate()">
                </div>
            </div>
            <div id="realTrafficDisplay">Tráfego Real Estimado: 0 Mbps</div>
        </div>

        <h3 style="margin-top:20px;">2. Configurações do Script</h3>
        
        <div class="checkbox-wrapper">
            <input type="checkbox" id="fullConfig" checked onchange="toggleFields()">
            <label for="fullConfig">Gerar Script Completo</label>
        </div>

        <div id="wanSettings">
            <label>Tipo de Conexão WAN (Ether1):</label>
            <select id="wanType" onchange="toggleFields()">
                <option value="dhcp">Cliente DHCP (IP Dinâmico)</option>
                <option value="pppoe">Cliente PPPoE (Discador)</option>
                <option value="static">IP Estático</option>
            </select>

            <div id="pppoeFields" class="hidden">
                <label>Usuário PPPoE:</label>
                <input type="text" id="pppoeUser" placeholder="usuario@provedor">
                <label>Senha PPPoE:</label>
                <input type="text" id="pppoePass" placeholder="senha123">
            </div>
        </div>

        <div class="checkbox-wrapper">
            <input type="checkbox" id="createAdmin" checked>
            <label for="createAdmin">Criar Admin "liomar" (Senha Segura)</label>
        </div>

        <button onclick="generateScript()" class="btn-primary" style="margin-top:20px;">Atualizar Script</button>
    </div>

    <div class="card">
        <h2>3. Capacidade e Saída</h2>
        
        <div class="meter-box">
            <div class="meter-label"><span>CPU Estimada</span> <span id="cpu-text">0%</span></div>
            <div class="track"><div id="cpu-bar" class="fill low"></div></div>
        </div>
        <div class="meter-box">
            <div class="meter-label"><span>RAM Estimada</span> <span id="ram-text">0/0 MB</span></div>
            <div class="track"><div id="ram-bar" class="fill low"></div></div>
        </div>
        
        <div id="verdict">Aguardando cálculo...</div>

        <textarea id="output" readonly></textarea>
        
        <div class="btn-group">
            <button onclick="copyToClipboard()" class="btn-secondary">📋 Copiar Texto</button>
            <button onclick="downloadScript()" class="btn-success">💾 Baixar .rsc</button>
        </div>
    </div>
</div>

<script>
    const hardwareDB = {
        'rb941': { name: 'RB941-2nD (hAP lite)', cpu_score: 100, ram: 32, arch: 'SMIPS', ports_desc: '4x 10/100', lan_ports: ['ether2', 'ether3', 'ether4'] },
        'rb750r2': { name: 'RB750r2 (hEX lite)', cpu_score: 130, ram: 64, arch: 'MIPSBE', ports_desc: '5x 10/100', lan_ports: ['ether2', 'ether3', 'ether4', 'ether5'] },
        'rb750gr3': { name: 'RB750Gr3 (hEX)', cpu_score: 880, ram: 256, arch: 'MMIPS', ports_desc: '5x Gigabit', lan_ports: ['ether2', 'ether3', 'ether4', 'ether5'] },
        'rb760igs': { name: 'RB760iGS (hEX S)', cpu_score: 890, ram: 256, arch: 'MMIPS', ports_desc: '5x Gigabit + 1x SFP', lan_ports: ['ether2', 'ether3', 'ether4', 'ether5', 'sfp1'] },
        'rb2011': { name: 'RB2011UiAS', cpu_score: 150, ram: 128, arch: 'MIPSBE', ports_desc: '5x Giga + 5x 10/100 + 1x SFP', lan_ports: ['ether2', 'ether3', 'ether4', 'ether5', 'ether6', 'ether7', 'ether8', 'ether9', 'ether10', 'sfp1'] },
        'rb3011': { name: 'RB3011UiAS', cpu_score: 2200, ram: 1024, arch: 'ARM', ports_desc: '10x Gigabit + 1x SFP', lan_ports: ['ether2', 'ether3', 'ether4', 'ether5', 'ether6', 'ether7', 'ether8', 'ether9', 'ether10', 'sfp1'] },
        'rb4011': { name: 'RB4011iGS+', cpu_score: 5500, ram: 1024, arch: 'ARM', ports_desc: '10x Gigabit + 1x SFP+', lan_ports: ['ether2', 'ether3', 'ether4', 'ether5', 'ether6', 'ether7', 'ether8', 'ether9', 'ether10', 'sfp-sfpplus1'] },
        'ccr1009': { name: 'CCR1009-7G-1C-1S+', cpu_score: 7500, ram: 2048, arch: 'TILE', ports_desc: '7x Giga + 1x Combo + 1x SFP+', lan_ports: ['ether2', 'ether3', 'ether4', 'ether5', 'ether6', 'ether7', 'combo1', 'sfp-sfpplus1'] },
        'ccr1036': { name: 'CCR1036-8G-2S+', cpu_score: 28000, ram: 4096, arch: 'TILE', ports_desc: '8x Gigabit + 2x SFP+', lan_ports: ['ether2', 'ether3', 'ether4', 'ether5', 'ether6', 'ether7', 'ether8', 'sfp-sfpplus1', 'sfp-sfpplus2'] }
    };

    function toggleFields() {
        const fullConfig = document.getElementById('fullConfig').checked;
        const wanType = document.getElementById('wanType').value;
        const pppoeFields = document.getElementById('pppoeFields');
        
        document.getElementById('wanSettings').style.display = fullConfig ? 'block' : 'none';
        pppoeFields.style.display = (fullConfig && wanType === 'pppoe') ? 'block' : 'none';
    }

    function calculate() {
        const modelKey = document.getElementById('model').value;
        const hw = hardwareDB[modelKey];
        const scenario = document.getElementById('scenario').value;
        const users = parseInt(document.getElementById('users').value) || 0;
        const linkTotal = parseInt(document.getElementById('bandwidth').value) || 0;
        const userDl = parseInt(document.getElementById('userDl').value) || 0;
        
        // --- 1. CÁLCULO DE TRÁFEGO REAL ---
        // O tráfego nunca será maior que o Link Total, nem maior que a soma dos planos dos usuários
        // Consideramos um fator de simultaneidade (nem todo mundo baixa a 100% o tempo todo)
        // Hotspot simultaneidade alta (0.8), Corporativo (0.4)
        let simultaneity = (scenario === 'hotspot') ? 0.8 : 0.4;
        let potentialTraffic = users * userDl * simultaneity;
        let effectiveTraffic = Math.min(linkTotal, potentialTraffic);
        
        document.getElementById('realTrafficDisplay').innerText = 
            `Tráfego Real Estimado: ~${Math.round(effectiveTraffic)} Mbps (Simultaneidade: ${simultaneity*100}%)`;

        document.getElementById('specs-div').innerHTML = 
            `<strong>CPU:</strong> ${hw.arch} (Score: ${hw.cpu_score})<br>
             <strong>RAM:</strong> ${hw.ram} MB<br>
             <strong>Portas:</strong> ${hw.ports_desc}`;

        // --- 2. CÁLCULO RAM ---
        let baseRam = (hw.arch === 'TILE' || hw.arch === 'ARM') ? 45 : 15;
        let ramPerUser = (scenario === 'hotspot') ? 0.50 : 0.10; // Aumentei levemente pois queues consomem RAM
        let totalRam = baseRam + (users * ramPerUser);
        let ramPercent = (totalRam / hw.ram) * 100;

        // --- 3. CÁLCULO CPU (QUEUES VS FASTTRACK) ---
        // Se for Hotspot, FastTrack é DESLIGADO para clientes -> Processamento via CPU
        // Se for Corporativo, FastTrack LIGADO -> Processamento via Switch Chip/Offload
        
        let cpuFactorPerMbps = 0;
        
        if (scenario === 'hotspot') {
            // Sem FastTrack + Overhead de Queues
            // RB750Gr3 (880 score) aguenta ~350Mbps de Queues Simples
            cpuFactorPerMbps = 1.2; 
        } else if (scenario === 'pppoe_server') {
            // Encapsulamento pesa
            cpuFactorPerMbps = 1.0;
        } else {
            // Corporativo com FastTrack (Muito leve)
            cpuFactorPerMbps = 0.2;
        }

        // Penalidade por quantidade de Queues (Scan linear consome CPU)
        let queueOverhead = users * 0.5; 

        // Penalidade por Gargalo Físico (Porta 100M saturada gera muita interrupção)
        let portBottleneck = 0;
        if (hw.ports_desc.includes('10/100') && effectiveTraffic > 90) portBottleneck = 500;

        let totalCpuPoints = (effectiveTraffic * cpuFactorPerMbps) + queueOverhead + portBottleneck;
        let cpuPercent = (totalCpuPoints / hw.cpu_score) * 100;

        updateBar('cpu', cpuPercent, 100);
        updateBar('ram', ramPercent, hw.ram, totalRam.toFixed(1));

        const verdict = document.getElementById('verdict');
        if (ramPercent > 95 || cpuPercent > 95) {
            verdict.innerHTML = "❌ INVIÁVEL: Hardware insuficiente para Queues/Tráfego.";
            verdict.style.backgroundColor = "var(--danger)";
            verdict.style.color = "#1e1e2e";
        } else if (ramPercent > 80 || cpuPercent > 80) {
            verdict.innerHTML = "⚠️ ALERTA: Hardware operando no limite.";
            verdict.style.backgroundColor = "var(--warning)";
            verdict.style.color = "#1e1e2e";
        } else {
            verdict.innerHTML = "✅ APROVADO: Hardware suporta a carga.";
            verdict.style.backgroundColor = "var(--success)";
            verdict.style.color = "#1e1e2e";
        }
    }

    function updateBar(type, percent, maxVal, currentValText = null) {
        const bar = document.getElementById(`${type}-bar`);
        const text = document.getElementById(`${type}-text`);
        let visualPercent = Math.min(percent, 100);
        bar.style.width = `${visualPercent}%`;
        bar.className = 'fill ' + (percent < 60 ? 'low' : percent < 85 ? 'med' : 'high');
        text.innerText = currentValText ? `${currentValText} / ${maxVal} MB (${Math.round(percent)}%)` : `${Math.round(percent)}%`;
    }

    function generateScript() {
        const modelKey = document.getElementById('model').value;
        const hw = hardwareDB[modelKey];
        const scenario = document.getElementById('scenario').value;
        const fullConfig = document.getElementById('fullConfig').checked;
        const userDl = document.getElementById('userDl').value;
        const userUl = document.getElementById('userUl').value;
        
        let s = `# Script Gerado em ${new Date().toLocaleString()}\n`;
        s += `# Hardware: ${hw.name} | Cenário: ${scenario.toUpperCase()}\n`;
        s += `# Plano Usuário: ${userDl}M Down / ${userUl}M Up\n\n`;

        if (fullConfig) {
            s += `/system identity set name="MikroTik-${scenario}"\n`;
            if (document.getElementById('createAdmin').checked) {
                s += `# --- USUARIOS ---\n`;
                s += `/user add name="liomar" password="Mudar@123" group=full comment="Admin"\n`;
                s += `/user remove [find name="admin"]\n\n`;
            }

            s += `# --- INTERFACES & BRIDGE ---\n`;
            s += `/interface ethernet set [find default-name=ether1] name="ether1-WAN" comment="Link Internet"\n`;
            s += `/interface bridge add name="bridge-LAN" comment="Bridge Local"\n`;
            hw.lan_ports.forEach(port => {
                s += `/interface bridge port add bridge=bridge-LAN interface=${port}\n`;
            });
            s += `\n`;

            if (scenario === 'hotspot') {
                s += `# --- VLAN HOTSPOT ---\n`;
                s += `/interface vlan add interface=bridge-LAN name="VLAN_100_WIFEED" vlan-id=100\n\n`;
            }

            s += `# --- CONEXAO WAN ---\n`;
            const wanType = document.getElementById('wanType').value;
            if (wanType === 'dhcp') {
                s += `/ip dhcp-client add interface=ether1-WAN disabled=no\n`;
            } else if (wanType === 'pppoe') {
                const pUser = document.getElementById('pppoeUser').value || 'usuario';
                const pPass = document.getElementById('pppoePass').value || 'senha';
                s += `/interface pppoe-client add name="pppoe-out1" interface=ether1-WAN user="${pUser}" password="${pPass}" disabled=no add-default-route=yes use-peer-dns=yes\n`;
            }
            s += `\n`;

            s += `# --- DNS & NTP ---\n`;
            s += `/ip dns set allow-remote-requests=yes servers=8.8.8.8,1.1.1.1\n`;
            s += `/system clock set time-zone-name=America/Bahia\n`;
            s += `/system ntp client set enabled=yes primary-ntp=200.160.7.186 secondary-ntp=200.189.40.8\n\n`;

            s += `# --- ENDERECOS LAN ---\n`;
            if (scenario === 'hotspot') {
                s += `/ip address add address=192.168.88.1/24 interface=bridge-LAN comment="Gerencia"\n`;
                s += `/ip address add address=10.10.0.1/22 interface=VLAN_100_WIFEED comment="Rede Hotspot"\n`;
            } else {
                s += `/ip address add address=192.168.88.1/24 interface=bridge-LAN comment="LAN"\n`;
            }
            s += `\n`;

            s += `# --- DHCP & NAT ---\n`;
            s += `/ip pool add name=pool-mgmt ranges=192.168.88.10-192.168.88.254\n`;
            s += `/ip dhcp-server add name=dhcp-mgmt interface=bridge-LAN address-pool=pool-mgmt disabled=no\n`;
            s += `/ip dhcp-server network add address=192.168.88.0/24 gateway=192.168.88.1 dns-server=192.168.88.1\n`;
            s += `/ip firewall nat add action=masquerade chain=srcnat out-interface-list=WAN\n`;
            s += `/interface list add name=WAN\n/interface list add name=LAN\n`;
            let wanIf = (wanType === 'pppoe') ? 'pppoe-out1' : 'ether1-WAN';
            s += `/interface list member add interface=${wanIf} list=WAN\n`;
            s += `/interface list member add interface=bridge-LAN list=LAN\n\n`;
        }

        s += `# --- OTIMIZACAO (QUEUES & FASTTRACK) ---\n`;
        s += `# FastTrack configurado para permitir Queues no Hotspot\n`;
        
        if (scenario === 'hotspot') {
            // A REGRA DE OURO: Excluir a interface do Hotspot do FastTrack
            s += `/ip firewall filter add chain=forward action=fasttrack-connection connection-state=established,related out-interface=!VLAN_100_WIFEED src-address=!10.10.0.0/22 comment="FastTrack (Exceto Hotspot)"\n`;
        } else {
            s += `/ip firewall filter add chain=forward action=fasttrack-connection connection-state=established,related comment="FastTrack Global"\n`;
        }
        
        s += `/ip firewall filter add chain=forward action=accept connection-state=established,related comment="Accept Est"\n`;

        if (scenario === 'hotspot') {
            s += `/ip firewall connection tracking set tcp-established-timeout=30m udp-timeout=10s\n`;
            s += `/ip neighbor discovery-settings set discover-interface-list=none\n`;
        }

        s += `/system watchdog set watchdog-timer=yes\n`;
        if (hw.ram < 64) s += `/system package disable ipv6,mpls\n`;

        document.getElementById('output').value = s;
    }

    function copyToClipboard() {
        const copyText = document.getElementById("output");
        copyText.select();
        document.execCommand("copy");
    }

    function downloadScript() {
        const text = document.getElementById("output").value;
        const blob = new Blob([text], { type: "text/plain" });
        const anchor = document.createElement("a");
        const model = document.getElementById('model').value;
        anchor.download = `config_mikrotik_${model}.rsc`;
        anchor.href = window.URL.createObjectURL(blob);
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
    }

    calculate();
    toggleFields();
</script>

</body>
</html>
