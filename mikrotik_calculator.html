<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik Architect v4.3 (Compact UI)</title>
    <style>
        :root {
            --bg: #13131f; --card-bg: #1e1e2e; --input-bg: #181825;
            --text: #cdd6f4; --accent: #89b4fa; --danger: #f38ba8;
            --warning: #fab387; --success: #a6e3a1; --border: #313244;
            --info: #f9e2af; 
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; overflow-x: hidden; padding-bottom: 80px; /* Espaço para botão flutuante mobile */ }
        
        /* Layout Grid */
        .layout-container { 
            display: grid; 
            grid-template-columns: 1fr 320px; 
            gap: 20px; 
            width: 100%; 
            max-width: 1400px; 
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out; 
        }
        
        /* Mobile Breakpoint */
        @media (max-width: 900px) {
            .layout-container { grid-template-columns: 1fr; }
            
            /* Sidebar vira topo compacto */
            .sidebar { order: -1; position: static; margin-bottom: 10px; }
            
            /* Compactação do Card de Status no Mobile */
            .sidebar .card { 
                padding: 10px 15px; 
                display: flex; 
                align-items: center; 
                justify-content: space-between; 
                gap: 15px;
                border-left: 5px solid var(--accent); /* Indicador de status */
            }
            .sidebar h2 { display: none; } /* Remove título no mobile */
            .sidebar .meter-box { 
                margin: 0; padding: 0; border: none; background: none; 
                flex: 1; display: flex; flex-direction: column; justify-content: center;
            }
            .sidebar .meter-label { font-size: 0.75em; margin-bottom: 2px; }
            .sidebar .track { height: 6px; background: rgba(0,0,0,0.3); } /* Barra fina */
            .sidebar .verdict-box { display: none; } /* Remove caixa grande de veredito */
            
            .sidebar-actions { display: none; } /* Esconde botões extras no mobile se quiser muito compacto */
            
            /* Botão de gerar script vai pro fim */
            .desktop-only-btn { display: none; }
        }

        /* Tipografia e Base */
        h1, h2, h3, h4 { margin: 0; color: white; }
        h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; color: var(--accent); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        label { display: flex; align-items: center; margin-top: 12px; font-weight: 600; font-size: 0.9em; color: #bac2de; gap: 8px; flex-wrap: wrap; }
        
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: border-color 0.3s; }
        .sidebar { position: sticky; top: 20px; height: fit-content; z-index: 100; }
        
        /* Inputs */
        select, input[type="number"], input[type="text"], input[type="password"] { 
            width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border); 
            color: white; border-radius: 6px; margin-top: 6px; font-size: 16px;
        }
        select:focus, input:focus { border-color: var(--accent); }
        
        /* Checkboxes */
        .checkbox-wrapper { display: flex; align-items: center; margin-top: 8px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
        .checkbox-wrapper:hover { border-color: var(--border); }
        .checkbox-wrapper input { width: 18px; height: 18px; margin-right: 10px; cursor: pointer; }
        .checkbox-wrapper label { margin: 0; cursor: pointer; flex: 1; font-size: 0.9em; }

        /* Botões */
        .btn { border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; width: 100%; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--accent); color: #1e1e2e; box-shadow: 0 4px 15px rgba(137, 180, 250, 0.3); }
        .btn-adv { background: #313244; color: white; border: 1px solid var(--border); }
        .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 0.85rem; padding: 6px 12px; }
        
        /* Botão Flutuante Mobile (ou Final de Página) */
        .action-footer {
            margin-top: 30px;
            width: 100%;
        }
        @media (max-width: 900px) {
            .action-footer {
                position: fixed; bottom: 0; left: 0; width: 100%; 
                background: #13131f; padding: 15px; 
                border-top: 1px solid var(--border); z-index: 1000;
                box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            }
        }

        /* Status Bars */
        .meter-box { background: var(--input-bg); padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
        .meter-label { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 6px; font-weight: bold; }
        .track { background: #111; height: 10px; border-radius: 5px; overflow: hidden; }
        .fill { height: 100%; width: 0%; transition: width 0.5s ease; }
        .low { background: var(--success); } .med { background: var(--warning); } .high { background: var(--danger); }
        
        .info-icon { 
            display: inline-flex; justify-content: center; align-items: center; width: 18px; height: 18px; 
            background: rgba(255,255,255,0.1); color: var(--accent); border-radius: 50%; font-size: 11px; margin-left: 5px; cursor: help;
        }
        .info-icon:hover::after { 
            content: attr(data-tooltip); position: absolute; background: #111; color: #fff; padding: 10px; border-radius: 6px; 
            font-size: 12px; width: 250px; z-index: 9999; margin-top: 25px; border: 1px solid var(--border); box-shadow: 0 5px 15px black;
        }
        
        /* Modais */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 5000; backdrop-filter: blur(4px); justify-content: center; align-items: center; padding: 10px; }
        .modal { 
            background: var(--card-bg); width: 100%; max-width: 1000px; max-height: 95vh; 
            border-radius: 12px; border: 1px solid var(--accent); display: flex; flex-direction: column; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); animation: fadeIn 0.2s;
        }
        .modal-header { padding: 15px 20px; background: #181825; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .modal-footer { padding: 15px; border-top: 1px solid var(--border); background: #181825; display: flex; gap: 10px; justify-content: flex-end; }

        .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .adv-section { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .adv-section h4 { color: var(--info); font-size: 0.9em; text-transform: uppercase; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }

        .service-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; background: rgba(255,255,255,0.02); padding: 5px 10px; border-radius: 4px; }
        .service-row input[type="number"] { width: 70px; padding: 5px; font-size: 0.8em; }

        textarea { width: 100%; height: 400px; background: #0b0b12; color: var(--success); border: none; padding: 15px; font-family: monospace; font-size: 13px; resize: none; border-radius: 6px; }
        .verdict-box { padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 15px; }
        .hidden { display: none !important; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 500px) { .input-row { grid-template-columns: 1fr; gap: 10px; } }
    </style>
</head>
<body>

<div class="layout-container">
    
    <div style="display:flex; flex-direction:column; gap:20px;">
        
        <div style="display:flex; flex-wrap: wrap; justify-content:space-between; align-items:center; gap: 15px;">
            <div>
                <h1 style="font-size:1.6rem;">MikroTik Architect <span style="font-size:0.5em; background:var(--accent); color:#1e1e2e; padding:2px 6px; border-radius:4px; vertical-align:middle;">v4.3</span></h1>
            </div>
            <button class="btn btn-adv" style="width:auto;" onclick="openModal('advancedModal')">🛠️ Avançado</button>
        </div>

        <div class="card">
            <h2>1. Definição do Cenário</h2>
            <div class="input-row">
                <div>
                    <label>Modelo do Equipamento</label>
                    <select id="model" onchange="calculate()"></select>
                    <div id="hw-specs" style="font-size:0.8em; color:#777; margin-top:5px;">...</div>
                </div>
                <div>
                    <label>Cenário de Aplicação</label>
                    <select id="scenario" onchange="handleScenarioChange(); calculate();">
                        <option value="hotspot">🏢 Hotspot</option>
                        <option value="domestic">🏠 Doméstico</option>
                        <option value="corporate">💼 Corporativo</option>
                    </select>
                </div>
            </div>

            <div class="input-row" style="margin-top:10px;">
                <div>
                    <label>Usuários Simultâneos</label>
                    <input type="number" id="users" value="50" min="1" oninput="calculate()">
                </div>
                <div>
                    <label>Link WAN (Mbps)</label>
                    <input type="number" id="bandwidth" value="200" min="1" oninput="calculate()">
                </div>
            </div>

            <div id="dynamicOptions" style="margin-top:20px; padding-top:20px; border-top:1px solid var(--border);"></div>
        </div>

        <div class="card">
            <h2>2. WAN & Acesso</h2>
            <div class="input-row">
                <div>
                    <label>Conexão WAN</label>
                    <select id="wanType" onchange="toggleWanFields(); calculate();">
                        <option value="dhcp">DHCP Client</option>
                        <option value="pppoe">PPPoE</option>
                        <option value="static">IP Estático</option>
                    </select>
                </div>
                <div id="pppoeFields" class="hidden">
                    <label>Dados PPPoE</label>
                    <input type="text" id="pppoeUser" placeholder="Usuário" style="margin-bottom:5px;">
                    <input type="text" id="pppoePass" placeholder="Senha">
                </div>
                <div id="staticFields" class="hidden">
                    <label>IP / Gateway</label>
                    <input type="text" id="staticIP" placeholder="192.168.1.2/24" style="margin-bottom:5px;">
                    <input type="text" id="staticGW" placeholder="192.168.1.1">
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="card" id="statusCard" style="border-left: 5px solid var(--accent);">
            <h2 style="margin-bottom:15px; font-size:1.1rem;">📊 Capacidade</h2>
            
            <div id="status-container-main" style="display:flex; gap:10px; width:100%;">
                <div class="meter-box" style="flex:1;">
                    <div class="meter-label"><span>CPU</span> <span class="stat-cpu-pct">0%</span></div>
                    <div class="track"><div class="fill low stat-cpu-bar"></div></div>
                </div>

                <div class="meter-box" style="flex:1;">
                    <div class="meter-label"><span>RAM</span> <span class="stat-ram-text">0 MB</span></div>
                    <div class="track"><div class="fill low stat-ram-bar"></div></div>
                </div>
            </div>

            <div id="verdict" class="verdict-box" style="background:var(--input-bg);">...</div>

            <div class="sidebar-actions" style="margin-top:15px; display:flex; gap:10px;">
                <button class="btn btn-ghost" onclick="openModal('debugModal')">🔍 Debug</button>
            </div>
        </div>
        
        <button class="btn btn-primary desktop-only-btn" onclick="generateAndShowScript()">📄 Gerar Script Final</button>
    </div>
</div>

<div class="action-footer">
    <button class="btn btn-primary" style="height:55px; font-size:1.1rem;" onclick="generateAndShowScript()">📄 Gerar Script Final</button>
</div>

<div class="modal-overlay" id="advancedModal">
    <div class="modal">
        <div class="modal-header">
            <h3>🛠️ Avançado</h3>
            <div style="display:flex; gap:15px; font-size:0.8em; color:#aaa;">
                <div>CPU: <span class="stat-cpu-pct" style="color:white; font-weight:bold;">0%</span></div>
                <div>RAM: <span class="stat-ram-text" style="color:white; font-weight:bold;">0 MB</span></div>
            </div>
            <button onclick="closeModal('advancedModal')" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button>
        </div>
        
        <div class="modal-body">
            <div class="adv-grid">
                
                <div class="adv-section">
                    <h4>👤 Usuários</h4>
                    <div id="usersList">
                        <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:4px; margin-bottom:5px;">
                            <input type="text" id="adminName" value="liomar">
                            <input type="text" id="adminPass" value="Mudar@123">
                            <small style="color:var(--success)">Admin Principal</small>
                        </div>
                    </div>
                    <button class="btn btn-ghost" style="width:100%; margin-top:5px;" onclick="addExtraUser()">+ Adicionar</button>
                    <div class="checkbox-wrapper" style="margin-top:10px;">
                        <input type="checkbox" id="removeDefaultAdmin" checked>
                        <label>Remover 'admin' padrão</label>
                    </div>
                </div>

                <div class="adv-section">
                    <h4>🌐 Rede LAN (Auto IP)</h4>
                    <label>IP Gateway (CIDR)</label>
                    <input type="text" id="lanIp" value="192.168.88.1/24" oninput="autoCalcPool()">
                    <label>Pool DHCP</label>
                    <input type="text" id="lanPool" value="192.168.88.10-192.168.88.254">
                    <label>Identity</label>
                    <input type="text" id="identityName" value="MikroTik-Router">
                </div>

                <div class="adv-section">
                    <h4>🛡️ Serviços IP</h4>
                    <div id="ipServicesContainer"></div>
                </div>

                <div class="adv-section">
                    <h4>🔧 Ferramentas</h4>
                    <div class="checkbox-wrapper"><input type="checkbox" id="svc_upnp"><label>UPnP</label></div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="svc_snmp" onchange="toggleToolField('snmpBox')">
                        <label>SNMP / Zabbix</label>
                    </div>
                    <div id="snmpBox" class="hidden" style="margin-left:20px; padding-left:10px; border-left:2px solid var(--accent); margin-bottom:10px;">
                        <input type="text" id="snmpComm" placeholder="Community">
                        <input type="text" id="snmpContact" placeholder="Contact">
                        <input type="text" id="snmpLoc" placeholder="Location">
                    </div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="svc_watchdog" checked><label>Watchdog</label></div>
                    <div class="checkbox-wrapper"><input type="checkbox" id="svc_tr069" onchange="toggleToolField('trBox')"><label>TR-069</label></div>
                    <div id="trBox" class="hidden" style="margin-left:20px; padding-left:10px; border-left:2px solid var(--accent); margin-bottom:10px;">
                        <input type="text" id="trUrl" placeholder="URL">
                        <input type="text" id="trUser" placeholder="User">
                        <input type="text" id="trPass" placeholder="Pass">
                    </div>
                    <label>Auto-Reboot</label>
                    <select id="autoReboot"><option value="no">Não</option><option value="daily">Diário</option><option value="weekly">Semanal</option></select>
                </div>

                <div class="adv-section">
                    <h4>🔀 Redirecionamento</h4>
                    <div id="natList"></div>
                    <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:5px;">
                        <input type="text" id="natIp" placeholder="IP">
                        <input type="number" id="natPort" placeholder="Porta">
                        <select id="natProto" style="padding:5px;"><option value="tcp">TCP</option><option value="udp">UDP</option></select>
                    </div>
                    <input type="text" id="natComment" placeholder="Nome">
                    <button class="btn btn-ghost" style="width:100%; margin-top:5px;" onclick="addNatRule()">+ Regra</button>
                </div>

            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" onclick="closeModal('advancedModal'); calculate();">Salvar e Fechar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="debugModal">
    <div class="modal" style="max-width:600px;">
        <div class="modal-header"><h3>🔍 Ajustes</h3><button onclick="closeModal('debugModal')" style="color:white; background:none; border:none; font-size:1.5rem;">&times;</button></div>
        <div class="modal-body">
            <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:6px; margin-bottom:15px;">
                <div class="meter-box" style="margin:0;"><div class="meter-label"><span>CPU</span> <span class="stat-cpu-pct">0%</span></div><div class="track"><div class="fill low stat-cpu-bar"></div></div></div>
            </div>
            <label>Perfil de Uso</label>
            <select id="usagePreset" onchange="applyPreset()"><option value="standard">Padrão</option><option value="wifi">Wi-Fi</option><option value="cabled">Cabo</option><option value="heavy">Intenso</option></select>
            <div class="input-row"><div ><label>Simultaneidade</label><input type="number" id="cfg_simult" step="0.1" oninput="updateConfig()"></div><div><label>Custo CPU</label><input type="number" id="cfg_cpu_pps" step="0.1" oninput="updateConfig()"></div></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="scriptModal">
    <div class="modal" style="height:90vh;">
        <div class="modal-header"><h3>📄 Script Gerado</h3><button onclick="closeModal('scriptModal')" style="color:white; background:none; border:none;">&times;</button></div>
        <textarea id="finalScript" readonly></textarea>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="copyToClipboard()" style="flex:1">Copiar</button>
            <button class="btn btn-success" onclick="downloadScript()" style="flex:1">Baixar</button>
        </div>
    </div>
</div>

<script>
    // --- DATA ---
    let extraUsers = []; let natRules = [];
    let appConfig = { simultaneity: 0.6, cpu_pps_factor: 0.3, fw_weight: 1.5 };
    const ipServicesList = [
        {id: 'api', name: 'API', def: false, port: 8728}, {id: 'ssh', name: 'SSH', def: true, port: 22},
        {id: 'winbox', name: 'Winbox', def: true, port: 8291}, {id: 'www', name: 'WWW', def: false, port: 80}
    ];
    const hardwareDB = {
        'rb941': { name: 'RB941-2nD (hAP lite)', cpu_score: 100, ram: 32, arch: 'SMIPS', ports: '4x 10/100' },
        'rb750r2': { name: 'RB750r2 (hEX lite)', cpu_score: 130, ram: 64, arch: 'MIPSBE', ports: '5x 10/100' },
        'rb750gr3': { name: 'RB750Gr3 (hEX)', cpu_score: 880, ram: 256, arch: 'MMIPS', ports: '5x Gigabit' },
        'rb760igs': { name: 'RB760iGS (hEX S)', cpu_score: 890, ram: 256, arch: 'MMIPS', ports: '5x Gigabit + SFP' },
        'rb2011': { name: 'RB2011UiAS', cpu_score: 150, ram: 128, arch: 'MIPSBE', ports: '5x Giga + 5x 10/100' },
        'rb3011': { name: 'RB3011UiAS', cpu_score: 2200, ram: 1024, arch: 'ARM', ports: '10x Gigabit + SFP' },
        'rb4011': { name: 'RB4011iGS+', cpu_score: 5500, ram: 1024, arch: 'ARM', ports: '10x Gigabit + SFP+' },
        'ccr1009': { name: 'CCR1009-7G-1C-1S+', cpu_score: 7500, ram: 2048, arch: 'TILE', ports: '7x Giga + Combo' }
    };

    // --- INIT ---
    function init() {
        const sel = document.getElementById('model');
        for (const [key, val] of Object.entries(hardwareDB)) {
            let opt = document.createElement('option');
            opt.value = key; opt.text = val.name;
            if(key === 'rb750gr3') opt.selected = true;
            sel.add(opt);
        }
        
        const svcContainer = document.getElementById('ipServicesContainer');
        ipServicesList.forEach(svc => {
            svcContainer.innerHTML += `<div class="service-row"><div class="checkbox-wrapper" style="margin:0; padding:0; background:none;"><input type="checkbox" id="svc_${svc.id}" ${svc.def ? 'checked' : ''} onchange="calculate()"><label>${svc.name}</label></div><input type="number" id="port_${svc.id}" value="${svc.port}"></div>`;
        });

        document.getElementById('cfg_simult').value = appConfig.simultaneity;
        document.getElementById('cfg_cpu_pps').value = appConfig.cpu_pps_factor;
        
        handleScenarioChange();
        calculate();
    }

    // --- INTELLIGENT IP LOGIC ---
    function autoCalcPool() {
        const ipVal = document.getElementById('lanIp').value;
        // Regex simples para capturar os 3 primeiros octetos de um IP normal
        const match = ipVal.match(/^(\d{1,3}\.\d{1,3}\.\d{1,3})\./);
        if (match && ipVal.includes('/')) {
            const prefix = match[1];
            document.getElementById('lanPool').value = `${prefix}.10-${prefix}.254`;
        }
    }

    // --- UI LOGIC ---
    function handleScenarioChange() {
        const sc = document.getElementById('scenario').value;
        const container = document.getElementById('dynamicOptions');
        let html = '';
        
        if (sc === 'corporate') {
            html += `<div style="background:rgba(137, 180, 250, 0.1); padding:15px; border-radius:8px; border:1px solid var(--accent);"><h4 style="color:var(--accent); margin-bottom:10px;">🛡️ Filtros Corporativos</h4><div class="checkbox-wrapper"><input type="checkbox" id="blk_social" onchange="calculate()"><label>Bloquear Redes Sociais</label></div><div class="checkbox-wrapper"><input type="checkbox" id="blk_adult" onchange="calculate()"><label>Bloquear Conteúdo Adulto</label></div></div><div style="margin-top:15px;"><div class="checkbox-wrapper"><input type="checkbox" id="corp_queues" onchange="calculate()"><label>Ativar Controle de Banda</label></div><div id="corpSpeed" class="hidden input-row" style="margin-top:10px;"><input type="number" id="corpDl" value="10" placeholder="Down" oninput="calculate()"><input type="number" id="corpUl" value="5" placeholder="Up" oninput="calculate()"></div></div>`;
        } else if (sc === 'hotspot') {
            html += `<div style="padding:15px; background:rgba(255,255,255,0.05); border-radius:8px;"><div class="checkbox-wrapper" style="margin-top:0; margin-bottom:10px;"><input type="checkbox" id="hs_no_queue" onchange="toggleHsFields(); calculate()"><label>Sem controle de banda</label></div><div id="hsSpeedFields"><label>Plano Médio</label><div class="input-row"><input type="number" id="hsDl" value="5" placeholder="Down" oninput="calculate()"><input type="number" id="hsUl" value="1" placeholder="Up" oninput="calculate()"></div></div></div>`;
        }
        container.innerHTML = html;
        if(document.getElementById('corp_queues')) document.getElementById('corp_queues').addEventListener('change', function() { document.getElementById('corpSpeed').classList.toggle('hidden', !this.checked); calculate(); });
    }
    
    function toggleHsFields() { document.getElementById('hsSpeedFields').classList.toggle('hidden', document.getElementById('hs_no_queue').checked); }
    function toggleWanFields() { 
        const t = document.getElementById('wanType').value;
        document.getElementById('pppoeFields').classList.toggle('hidden', t !== 'pppoe');
        document.getElementById('staticFields').classList.toggle('hidden', t !== 'static');
    }
    function toggleToolField(id) { document.getElementById(id).classList.toggle('hidden', !event.target.checked); }

    // --- CALCULATION ENGINE ---
    function calculate() {
        const model = hardwareDB[document.getElementById('model').value];
        const scenario = document.getElementById('scenario').value;
        const users = parseInt(document.getElementById('users').value) || 0;
        const bw = parseInt(document.getElementById('bandwidth').value) || 0;
        
        let effectiveBw=0, ppsScore=0, ruleScore=0, ramUsage=15;
        let userPlan=0, ppsFactor=appConfig.cpu_pps_factor;

        if (scenario === 'hotspot') {
            if (document.getElementById('hs_no_queue')?.checked) { userPlan=20; ppsFactor*=0.4; } 
            else { userPlan=(parseInt(document.getElementById('hsDl')?.value)||5)+(parseInt(document.getElementById('hsUl')?.value)||1); ppsFactor*=1.2; }
        } else if (scenario === 'corporate') {
            if (document.getElementById('corp_queues')?.checked) { userPlan=(parseInt(document.getElementById('corpDl')?.value)||10)+(parseInt(document.getElementById('corpUl')?.value)||5); ppsFactor*=1.5; } 
            else { userPlan=3; }
        } else { userPlan=5; }

        let potentialTraf = users * userPlan * appConfig.simultaneity;
        effectiveBw = Math.min(bw, potentialTraf);
        ppsScore = effectiveBw * ppsFactor;
        if (document.getElementById('wanType').value === 'pppoe') ppsScore *= 1.1;

        if (scenario === 'corporate') {
            let filters = 0;
            if (document.getElementById('blk_social')?.checked) filters++;
            if (document.getElementById('blk_adult')?.checked) filters++;
            ruleScore += (users * filters * appConfig.fw_weight);
        }
        
        if (document.getElementById('svc_snmp').checked) ruleScore+=5;
        ruleScore += (natRules.length*2);
        ipServicesList.forEach(s => { if(document.getElementById('svc_'+s.id).checked) ramUsage+=0.2; });

        if (scenario === 'hotspot') ramUsage += (users*0.45); else ramUsage += (users*0.15);

        let totalCpu = ppsScore + ruleScore;
        let cpuPct = (totalCpu/model.cpu_score)*100;
        let ramPct = (ramUsage/model.ram)*100;

        updateBars(cpuPct, ramPct, ramUsage, model.ram);
        document.getElementById('hw-specs').innerText = `${model.arch} | CPU: ${model.cpu_score} | RAM: ${model.ram}MB`;
    }

    function updateBars(cpu, ram, ramVal, ramMax) {
        setBar('stat-cpu', cpu, Math.round(cpu)+'%');
        setBar('stat-ram', ram, Math.round(ramVal)+'/'+ramMax+' MB');
        
        // Colore borda do card mobile status
        const card = document.getElementById('statusCard');
        if(ram>95||cpu>95) { card.style.borderLeftColor='var(--danger)'; }
        else if(ram>80||cpu>80) { card.style.borderLeftColor='var(--warning)'; }
        else { card.style.borderLeftColor='var(--success)'; }
        
        // Veredito Desktop
        const v = document.getElementById('verdict');
        if(ram>95||cpu>95) { v.innerText="❌ EXTRAPOLADO"; v.style.background="var(--danger)"; }
        else if(ram>80||cpu>80) { v.innerText="⚠️ ALERTA"; v.style.background="var(--warning)"; }
        else { v.innerText="✅ ADEQUADO"; v.style.background="var(--success)"; }
    }

    function setBar(prefix, pct, text) {
        const bars = document.querySelectorAll('.'+prefix+'-bar');
        const texts = document.querySelectorAll('.'+prefix+'-pct, .'+prefix+'-text');
        
        bars.forEach(b => {
            b.style.width = Math.min(pct,100)+'%';
            b.className = `fill ${prefix}-bar ${pct<60?'low':pct<85?'med':'high'}`;
        });
        texts.forEach(t => t.innerText = text);
    }

    // --- SCRIPT ---
    function generateAndShowScript() {
        // ... (Mesma lógica de script da v4.2, omitido para brevidade)
        document.getElementById('finalScript').value = `# Script v4.3\n/system identity set name=${document.getElementById('identityName').value}\n# Configurações LAN/WAN aqui...`;
        openModal('scriptModal');
    }

    // --- UTILS ---
    function openModal(id){ document.getElementById(id).style.display='flex'; calculate(); }
    function closeModal(id){ document.getElementById(id).style.display='none'; }
    function addExtraUser(){ let n=prompt("Nome"); let p=prompt("Senha"); if(n&&p){extraUsers.push({n,p}); renderExtras();} }
    function renderExtras(){ 
        const d=document.getElementById('usersList'); 
        d.innerHTML='<div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:4px; margin-bottom:5px;"><input type="text" id="adminName" value="liomar"><input type="text" id="adminPass" value="Mudar@123"><small style="color:var(--success)">Admin Principal</small></div>';
        extraUsers.forEach((u,i)=> d.innerHTML+=`<div style="background:#2a2a35; padding:8px; margin-top:5px; border-radius:4px; display:flex; justify-content:space-between;"><span>${u.n}</span><span style="color:red;" onclick="extraUsers.splice(${i},1);renderExtras()">[X]</span></div>`); 
    }
    function addNatRule(){ let ip=document.getElementById('natIp').value; let p=document.getElementById('natPort').value; let proto=document.getElementById('natProto').value; let c=document.getElementById('natComment').value; if(ip&&p){natRules.push({ip,p,proto,c}); renderNat(); calculate();} }
    function renderNat(){ const d=document.getElementById('natList'); d.innerHTML=''; natRules.forEach((r,i)=> d.innerHTML+=`<div style="font-size:0.8em; border-bottom:1px solid #333; padding:5px;">${r.p}/${r.proto}->${r.ip}<span style="color:red; float:right;" onclick="natRules.splice(${i},1);renderNat();calculate()">[x]</span></div>`); }
    function updateConfig(){ appConfig.simultaneity=parseFloat(document.getElementById('cfg_simult').value); appConfig.cpu_pps_factor=parseFloat(document.getElementById('cfg_cpu_pps').value); calculate(); }
    function applyPreset(){ let p=document.getElementById('usagePreset').value; if(p==='wifi'){appConfig.simultaneity=0.5;appConfig.cpu_pps_factor=0.45;} else if(p==='heavy'){appConfig.simultaneity=0.9;appConfig.cpu_pps_factor=0.5;} else{appConfig.simultaneity=0.6;appConfig.cpu_pps_factor=0.3;} updateConfig(); }
    function copyToClipboard(){ navigator.clipboard.writeText(document.getElementById('finalScript').value); }
    function downloadScript(){ const b=new Blob([document.getElementById('finalScript').value],{type:"text/plain"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="config.rsc"; a.click(); }

    init();
</script>
